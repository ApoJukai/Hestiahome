<script>
const rates={HUF:1,USD:0.00255,EUR:0.00235,PHP:0.145};
const locales={HUF:'hu-HU',USD:'en-US',EUR:'de-DE',PHP:'en-PH'};
const defaultState={currency:'HUF',transactions:[['Salary','Salary',1250000,new Date().toISOString()],['Grocery Market','Groceries',-32000,new Date().toISOString()],['Electricity','Utilities',-41500,new Date().toISOString()],['Streaming','Entertainment',-10500,new Date().toISOString()]],budgets:[['Groceries',200000],['Utilities',120000],['Entertainment',80000],['Transport',110000]],tasks:[],messages:[],inventory:[],shopping:[],goals:[],rewards:[['Family movie night',200],['Choose dessert',100]],rewardClaims:[],recurringTasks:[],notificationDismissals:[],accounts:[['Main account','Bank',0]],calendarEvents:[],activities:[],budgetInitializedMonths:[]};
let state=JSON.parse(localStorage.getItem('hestiaState')||'null')||structuredClone(defaultState);state.currency=state.currency||'HUF';
let taskFilters={status:'all',category:'all',assignee:'all'};let dashboardPreferences=JSON.parse(localStorage.getItem('hestiaDashboardPreferences')||'null')||{order:['summary','tasks','budget','transactions','shopping','goals','leaderboard'],visible:{summary:true,tasks:true,budget:true,transactions:true,shopping:true,goals:true,leaderboard:true},size:{summary:'wide',tasks:'compact',budget:'compact',transactions:'compact',shopping:'compact',goals:'compact',leaderboard:'compact'}};
let dashboardEditMode=false;
const taskCategories=['Chores','Cleaning','Cooking','Shopping','Maintenance','Finance','School','Health','Pet care','Family','Other'];const taskCategoryIcons={Chores:'🧹',Cleaning:'🧼',Cooking:'🍳',Shopping:'🛒',Maintenance:'🛠️',Finance:'💳',School:'🎓',Health:'🩺','Pet care':'🐾',Family:'🏠',Other:'📌'};
let current='Dashboard', currentUser={displayName:'User',role:'member'}, householdMembers=[], cloudSave=null;
const names=['Dashboard','Finances','Budgets','Tasks','Shopping','Inventory','Goals','Calendar','Accounts','Rewards','Leaderboard','Activity','Chat','Household'];
const navIcons={Dashboard:'▦',Finances:'◉',Budgets:'▤',Tasks:'✓',Shopping:'🛒',Inventory:'◫',Goals:'◎',Calendar:'📅',Accounts:'💰',Rewards:'★',Leaderboard:'🏆',Activity:'🕘',Chat:'◌',Household:'♙'};nav.innerHTML=names.map(n=>`<button class="nav ${n==='Dashboard'?'active':''}" onclick="show('${n}',this)"><span style="display:inline-block;width:24px">${navIcons[n]}</span>${n}</button>`).join('');
function accountNames(){return (state.accounts||[]).map(x=>x[0])}
function accountBalance(name){let opening=Number((state.accounts||[]).find(x=>x[0]===name)?.[2]||0);let tx=state.transactions.filter(t=>(t[4]||'Main account')===name).reduce((a,t)=>a+Number(t[2]),0);return opening+tx}
function logActivity(icon,text){state.activities=state.activities||[];state.activities.unshift([icon,text,currentUser.displayName||'User',new Date().toISOString()]);state.activities=state.activities.slice(0,300)}
function escapeCsv(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replaceAll('"','""')+'"':v}
function downloadText(name,text,type='text/plain'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportBackup(){downloadText(`hestia-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({version:12,exportedAt:new Date().toISOString(),state},null,2),'application/json')}
function exportTransactionsCsv(){let rows=[['Description','Category','Amount HUF','Date','Account'],...state.transactions.map(t=>[t[0],t[1],t[2],t[3],t[4]||'Main account'])];downloadText('hestia-transactions.csv',rows.map(r=>r.map(escapeCsv).join(',')).join('\n'),'text/csv')}
function fmt(huf){let c=state.currency||'HUF',v=Number(huf||0)*rates[c];return new Intl.NumberFormat(locales[c],{style:'currency',currency:c,maximumFractionDigits:c==='HUF'?0:2}).format(v)}
function inputToHuf(value){return Number(value||0)/rates[state.currency||'HUF']}
function save(){localStorage.setItem('hestiaState',JSON.stringify(state));cloudSave?.(state)}
function expenseByCategory(cat){return state.transactions.filter(t=>Number(t[2])<0&&String(t[1]).toLowerCase()===String(cat).toLowerCase()).reduce((a,t)=>a+Math.abs(Number(t[2])),0)}
function totalIncome(){return state.transactions.filter(t=>Number(t[2])>0).reduce((a,t)=>a+Number(t[2]),0)}
function totalExpenses(){return state.transactions.filter(t=>Number(t[2])<0).reduce((a,t)=>a+Math.abs(Number(t[2])),0)}

 if(ctx==='Goal')return `<label>Goal name<input name="name" value="${data.name||''}" required></label><label>Current amount (${state.currency})<input name="current" type="number" min="0" step="any" value="${data.current||0}" required></label><label>Target amount (${state.currency})<input name="target" type="number" min="0" step="any" value="${data.target||''}" required></label><label>Target date<input name="date" type="date" value="${data.date||''}" required></label>`;

modalForm.onsubmit=e=>{
 e.preventDefault();let d=Object.fromEntries(new FormData(modalForm));

 else if(ctx==='Budget'){let month=editIndex>=0?(state.budgets[editIndex][2]||selectedMonth):selectedMonth,row=[d.category,inputToHuf(d.limit),month];editIndex>=0?state.budgets[editIndex]=row:state.budgets.push(row);markBudgetMonthInitialized(month)}
 else if(ctx==='Task'){let done=editIndex>=0?state.tasks[editIndex][4]:false;let category=String(d.category||'Other').replace(/^\S+\s+/,'');let seriesId=editIndex>=0?(state.tasks[editIndex][10]||''):(d.recurrence&&d.recurrence!=='none'?'series_'+Date.now():'');let row=[d.name,d.owner,d.due,Number(d.points),done,category,d.notes||'',d.reminder||'',d.recurrence||'none',d.repeatUntil||'',seriesId];editIndex>=0?state.tasks[editIndex]=row:state.tasks.push(row);syncRecurringTemplate(row)}
 else if(ctx==='Message')state.messages.push([currentUser.displayName,d.name,new Date().toISOString()]);
 else if(ctx==='Shopping'){let checked=editIndex>=0?state.shopping[editIndex][3]:false,row=[d.name,d.category,Number(d.qty),checked];editIndex>=0?state.shopping[editIndex]=row:state.shopping.push(row)}
 else if(ctx==='Inventory'){let row=[d.name,d.category,Number(d.qty),d.unit,d.status];editIndex>=0?state.inventory[editIndex]=row:state.inventory.push(row)}
 else if(ctx==='Goal'){let row=[d.name,inputToHuf(d.current),inputToHuf(d.target),d.date];editIndex>=0?state.goals[editIndex]=row:state.goals.push(row)}
 else if(ctx==='Reward'){let row=[d.name,Number(d.points)];editIndex>=0?state.rewards[editIndex]=row:state.rewards.push(row)}
 else if(ctx==='Account'){let row=[d.name,d.type,inputToHuf(d.opening)];if(editIndex>=0){let old=state.accounts[editIndex][0];state.accounts[editIndex]=row;state.transactions.forEach(t=>{if((t[4]||'Main account')===old)t[4]=d.name})}else state.accounts.push(row);logActivity('🏦',`${editIndex>=0?'Updated':'Added'} account ${d.name}`)}
 else if(ctx==='CalendarEvent'){let row=[d.name,d.date,d.kind,d.notes||''];editIndex>=0?state.calendarEvents[editIndex]=row:state.calendarEvents.push(row);logActivity('📅',`${editIndex>=0?'Updated':'Added'} calendar event ${d.name}`)}
 else if(ctx==='HouseholdMember'){window.hestiaAddManualMember?.(d.name,d.role)}
 if(!['Account','CalendarEvent'].includes(ctx))logActivity(ctx==='Task'?'📋':ctx==='Transaction'?'💳':'✎',`${editIndex>=0?'Updated':'Added'} ${ctx.toLowerCase()}`);save();closeModal();render();
};
function sendChat(){let v=chatInput.value.trim();if(v){state.messages.push([currentUser.displayName,v,new Date().toISOString()]);save();render()}}
function notificationKey(type,id){return `${type}:${id}`}
function buildNotifications(){let now=new Date(),items=[];state.notificationDismissals=state.notificationDismissals||[];
 state.tasks.forEach((t,i)=>{if(t[4])return;let due=t[2]?new Date(t[2]+'T23:59:59'):null,rem=t[7]?new Date(t[7]):null;if(rem&&!isNaN(rem)&&rem<=now)items.push({key:notificationKey('reminder',t[10]||i),icon:'🔔',title:t[0],text:`Reminder for ${t[1]} · ${rem.toLocaleString()}`,target:'Tasks'});if(due&&!isNaN(due)&&due<now)items.push({key:notificationKey('overdue',t[10]||i),icon:'⚠️',title:`Overdue: ${t[0]}`,text:`Assigned to ${t[1]} · due ${due.toLocaleDateString()}`,target:'Tasks'})});
 (state.inventory||[]).forEach((x,i)=>{if(['Low','Out'].includes(x[4]))items.push({key:notificationKey('stock',i),icon:x[4]==='Out'?'⛔':'📦',title:`${x[0]} is ${x[4].toLowerCase()}`,text:`${x[2]} ${x[3]} remaining`,target:'Inventory'})});
 state.budgets.forEach((b,i)=>{let pct=b[1]?expenseByCategory(b[0])/b[1]*100:0;if(pct>=90)items.push({key:notificationKey('budget',i),icon:'💸',title:`${b[0]} budget at ${Math.round(pct)}%`,text:`${fmt(expenseByCategory(b[0]))} spent of ${fmt(b[1])}`,target:'Budgets'})});
 return items.filter(x=>!state.notificationDismissals.includes(x.key))}
function refreshNotifications(){let items=buildNotifications();if(typeof notificationCount!=='undefined'&&notificationCount){notificationCount.textContent=items.length;notificationCount.classList.toggle('hide',!items.length)}if(typeof notificationList!=='undefined'&&notificationList)notificationList.innerHTML=items.map(x=>`<div class="notification-item unread"><div class="icon-tile">${x.icon}</div><div><b>${x.title}</b><small>${x.text}</small><div class="notification-actions"><button class="btn" onclick="openNotificationTarget('${x.target}')">Open</button></div></div><button class="btn" onclick="dismissNotification('${x.key}')">×</button></div>`).join('')||'<div class="empty-state">🔔<br>You’re all caught up.</div>'}
function toggleNotificationPanel(){notificationPanel.classList.toggle('hide');notificationButton.setAttribute('aria-expanded',String(!notificationPanel.classList.contains('hide')));refreshNotifications()}
function dismissNotification(key){state.notificationDismissals.push(key);save();refreshNotifications()}
function markAllNotificationsRead(){state.notificationDismissals.push(...buildNotifications().map(x=>x.key));state.notificationDismissals=[...new Set(state.notificationDismissals)];save();refreshNotifications()}

currency.onchange=()=>{state.currency=currency.value;save();render()};
function syncRecurringTemplate(task){state.recurringTasks=state.recurringTasks||[];let id=task[10];if(!id)return;let idx=state.recurringTasks.findIndex(x=>x.id===id);if(task[8]==='none'){if(idx>=0)state.recurringTasks.splice(idx,1);return}let template={id,title:task[0],owner:task[1],points:task[3],category:task[5],notes:task[6],reminderTime:task[7]?String(task[7]).slice(11,16):'',recurrence:task[8],repeatUntil:task[9],lastGenerated:task[2]};idx>=0?state.recurringTasks[idx]=template:state.recurringTasks.push(template)}
function nextRecurringDate(date,rule){let d=new Date(date+'T12:00:00');if(rule==='daily')d.setDate(d.getDate()+1);else if(rule==='weekly')d.setDate(d.getDate()+7);else if(rule==='monthly')d.setMonth(d.getMonth()+1);else if(rule==='weekdays'){do{d.setDate(d.getDate()+1)}while([0,6].includes(d.getDay()))}return d.toISOString().slice(0,10)}
function deleteBudget(i){let removed=state.budgets.splice(i,1)[0];if(!removed)return;save();render();if(typeof showToast==='function')showToast('Budget deleted','Undo',()=>{state.budgets.splice(i,0,removed);save();render()})}
function deleteTransaction(i){
 let removed=state.transactions.splice(i,1)[0];
 if(!removed)return;
 save();render();
 if(typeof showToast==='function')showToast('Transaction deleted','Undo',()=>{state.transactions.splice(i,0,removed);save();render()});
}
function generateRecurringTasks(){state.recurringTasks=state.recurringTasks||[];let today=new Date().toISOString().slice(0,10),added=false;state.recurringTasks.forEach(r=>{let next=nextRecurringDate(r.lastGenerated,r.recurrence),guard=0;while(next<=today&&guard++<40){if(r.repeatUntil&&next>r.repeatUntil)break;let reminder=r.reminderTime?`${next}T${r.reminderTime}`:'';state.tasks.push([r.title,r.owner,next,r.points,false,r.category,r.notes,reminder,r.recurrence,r.repeatUntil,r.id]);r.lastGenerated=next;next=nextRecurringDate(r.lastGenerated,r.recurrence);added=true}});if(added)save()}

let nowForMonth=new Date(),selectedMonth=localStorage.getItem('hestiaSelectedMonth')||`${nowForMonth.getFullYear()}-${String(nowForMonth.getMonth()+1).padStart(2,'0')}`,transactionSearch='';
function monthKey(v){let d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,7)}
function monthLabel(){let [y,m]=selectedMonth.split('-').map(Number);return new Date(y,m-1,1).toLocaleString([],{month:'long',year:'numeric'})}
function setSelectedMonth(v){selectedMonth=v||new Date().toISOString().slice(0,7);localStorage.setItem('hestiaSelectedMonth',selectedMonth);ensureMonthlyBudgets(selectedMonth);render()}
function moveSelectedMonth(n){let [y,m]=selectedMonth.split('-').map(Number);let d=new Date(y,m-1+n,1,12,0,0);let next=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;setSelectedMonth(next)}
function currentMonthKey(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthSelector(){return `<div class="month-bar"><button type="button" class="btn" onclick="moveSelectedMonth(-1)" aria-label="Previous month">←</button><strong>${monthLabel()}</strong><button type="button" class="btn" onclick="moveSelectedMonth(1)" aria-label="Next month">→</button><input type="month" value="${selectedMonth}" onchange="setSelectedMonth(this.value)"><button type="button" class="btn" onclick="setSelectedMonth(currentMonthKey())">Current month</button></div>`}
function migrateMonthlyBudgets(){
 state.budgets=(state.budgets||[]).map(b=>[b[0],Number(b[1]),b[2]||selectedMonth]);
 state.budgetInitializedMonths=state.budgetInitializedMonths||[];
 state.budgets.forEach(b=>markBudgetMonthInitialized(b[2]));
}
function markBudgetMonthInitialized(month){
 state.budgetInitializedMonths=state.budgetInitializedMonths||[];
 if(month&&!state.budgetInitializedMonths.includes(month))state.budgetInitializedMonths.push(month);
}
function budgetMonthName(month){
 let [y,m]=String(month).split('-').map(Number);
 return new Date(y,m-1,1).toLocaleString([],{month:'long',year:'numeric'});
}
function ensureMonthlyBudgets(month=selectedMonth){
 migrateMonthlyBudgets();
 if(!month||state.budgetInitializedMonths.includes(month))return false;
 let source=[...new Set(state.budgets.map(b=>b[2]).filter(x=>x&&x<month))].sort().at(-1);
 if(source){
  state.budgets.filter(b=>b[2]===source).forEach(b=>state.budgets.push([b[0],Number(b[1]),month]));
 }
 markBudgetMonthInitialized(month);
 localStorage.setItem('hestiaState',JSON.stringify(state));
 if(source&&typeof showToast==='function')setTimeout(()=>showToast(`Budgets copied from ${budgetMonthName(source)}`),0);
 return Boolean(source);
}
migrateMonthlyBudgets();
ensureMonthlyBudgets(selectedMonth);
const allIncomeTotal=()=>state.transactions.filter(t=>+t[2]>0).reduce((a,t)=>a+ +t[2],0),allExpenseTotal=()=>state.transactions.filter(t=>+t[2]<0).reduce((a,t)=>a+Math.abs(+t[2]),0);
totalIncome=()=>state.transactions.filter(t=>monthKey(t[3])===selectedMonth&&+t[2]>0).reduce((a,t)=>a+ +t[2],0);
totalExpenses=()=>state.transactions.filter(t=>monthKey(t[3])===selectedMonth&&+t[2]<0).reduce((a,t)=>a+Math.abs(+t[2]),0);
